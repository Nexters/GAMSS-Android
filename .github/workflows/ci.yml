name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: detekt
            task: detekt
          - name: lint
            task: lint
          - name: test
            task: test
          - name: build
            task: assembleRelease

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 모델(.tflite)/네이티브(.so)가 필요한 build 잡에서만 LFS 다운로드 (대역폭 절약)
          lfs: ${{ matrix.name == 'build' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload detekt SARIF to code scanning
        if: ${{ always() && matrix.name == 'detekt' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/merged.sarif
          category: detekt

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
