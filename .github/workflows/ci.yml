name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: detekt
            task: detekt
          - name: lint
            task: lint
          - name: test
            task: test
          - name: build
            task: assembleRelease assembleInternal
          - name: build-debug
            task: assembleDebug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # 모델(.tflite)/네이티브(.so)가 필요한 build 잡만 LFS 를 받습니다. checkout 의 lfs 옵션은 매
      # 실행마다 같은 파일을 다시 내려받아 LFS 대역폭 예산을 태우므로, 캐시를 거친 git lfs pull 로
      # 대체합니다. 캐시 키는 LFS 객체의 OID 목록이라 모델이 바뀔 때만 새로 내려받습니다.
      - name: Create LFS file list
        if: ${{ matrix.name == 'build' || matrix.name == 'build-debug' }}
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        if: ${{ matrix.name == 'build' || matrix.name == 'build-debug' }}
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      # LFS 예산이 소진되면 이 단계가 실패합니다. 그래도 컴파일·패키징 회귀는 잡을 수 있으므로
      # 빌드는 계속하고, 대신 모델이 포인터 상태인 APK 가 아티팩트로 나가지 않게 아래에서 막습니다.
      - name: Pull LFS objects
        id: lfs_pull
        if: ${{ matrix.name == 'build' || matrix.name == 'build-debug' }}
        continue-on-error: true
        run: git lfs pull

      - name: Warn when LFS objects are unavailable
        if: ${{ steps.lfs_pull.outcome == 'failure' }}
        run: |
          echo "::warning title=LFS 객체 없음::모델 파일이 포인터 상태입니다. 컴파일 검증만 수행하고 APK 아티팩트는 올리지 않습니다."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Write local.properties
        shell: bash
        run: |
          printf 'DEV_BASE_URL=%s\n' "${{ secrets.DEV_BASE_URL }}" > local.properties
          printf 'PROD_BASE_URL=%s\n' "${{ secrets.PROD_BASE_URL }}" >> local.properties

      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload detekt SARIF to code scanning
        if: ${{ always() && matrix.name == 'detekt' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/merged.sarif
          category: detekt

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      # 모델이 포인터 상태인 APK 를 올리면 받아서 설치한 사람이 기능이 죽은 빌드를 쓰게 됩니다.
      - name: Upload APKs
        if: ${{ success() && matrix.name == 'build' && steps.lfs_pull.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/internal/*.apk
          if-no-files-found: error
          retention-days: 7
