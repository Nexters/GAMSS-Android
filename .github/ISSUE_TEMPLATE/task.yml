name: 태스크
description: 구현하거나 처리해야 할 작업 단위를 등록합니다
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 작업 내용
      description: 무엇을 해야 하는지
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경 / 목적
      description: 이 작업이 왜 필요한지
    validations:
      required: false
  - type: textarea
    id: todo
    attributes:
      label: 세부 항목
      description: 작업을 세분화한 체크리스트
      value: |
        - [ ]
        - [ ]
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 충족되면 이 작업이 완료된 것으로 볼지
    validations:
      required: false
