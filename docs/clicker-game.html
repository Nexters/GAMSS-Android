}
.app {
  box-sizing: border-box;
  max-width: 402px;
  min-height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  user-select: none;
  -webkit-user-select: none;
}
.title {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink-soft);
  text-align: center;
}
.board {
  margin-top: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 4vw, 36px);
}
.labeled {
  min-width: 62px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.labeled svg { width: 24px; height: 24px; }
.side { width: 62px; flex: none; }
button.labeled {
  background: none;
  border: 0;
  padding: 4px;
  margin: -4px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: inherit;
  cursor: pointer;
  border-radius: 8px;
}
button.labeled:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.record {
  min-width: 142px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  padding: 15px 16px;
  background: var(--card);
  border: 1.5px solid var(--ink);
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.status {
  margin: 14px 0 0;
  min-height: 1.5em;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
}
.status.done { color: var(--ink-soft); font-weight: 600; }
.gauge-area {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-top: 8px;
}
.note {
  position: relative;
  width: min(366px, 100%);
  aspect-ratio: 366 / 347;
}
.note > * { position: absolute; }
.sheet { width: 71.04%; height: 77.81%; box-sizing: border-box; }
.sheet.back { left: 13.69%; top: 12.62%; background: var(--shadow-paper); transform: rotate(-3.55deg); }
.sheet.front { left: 14.27%; top: 10.31%; background: var(--card); border: 2px solid var(--ink); transform: rotate(-4.97deg); }
.character { left: 22.37%; top: 22.34%; width: 55.26%; height: 55.6%; }
.character img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
.character .clip { clip-path: inset(var(--empty, 100%) 0 0 0); }
.tape { width: 11.44%; height: 12.05%; }
.tape.right { left: 73.59%; top: 4.42%; transform: rotate(-15deg); }
.tape.left { left: 7.92%; top: 9.8%; transform: rotate(90deg); }
.keys {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  gap: 32px;
}

<script>
(() => {
  const DURATION_MS = 30000;
  // 마우스로도 할 만하도록 앱보다 쉽게 둔다. 1초에 5번 누르면 약 7초에 찬다.
  const GAUGE_PER_TAP = 0.04;
  const DRAIN_PER_SECOND = 0.06;
  const FULL_TOLERANCE = 0.0001;
  const MAX_FRAME_DELTA_MS = 100;

  const initial = () => ({ phase: "ready", gauge: 0, elapsedMs: 0 });

  function tap(s) {
    if (s.phase === "finished") return s;
    const full = s.gauge + GAUGE_PER_TAP >= 1 - FULL_TOLERANCE;
    return { ...s, phase: full ? "finished" : "playing", gauge: full ? 1 : s.gauge + GAUGE_PER_TAP };
  }

  function advance(s, deltaMs) {
    if (s.phase !== "playing") return s;
    const elapsedMs = Math.min(s.elapsedMs + deltaMs, DURATION_MS);
    return {
      ...s,
      phase: elapsedMs >= DURATION_MS ? "finished" : "playing",
      gauge: Math.max(0, s.gauge - DRAIN_PER_SECOND * deltaMs / 1000),
      elapsedMs,
    };

  // 디코딩은 미리 해 두고, 터치 기기는 손을 뗄 때만 소리를 허용하므로 누를 때와 뗄 때 모두 깨운다.
  let audioCtx = null;
  let keyBuffer = null;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bytes = Uint8Array.from(atob(KEY_SOUND), (c) => c.charCodeAt(0));
    audioCtx.decodeAudioData(bytes.buffer, (buf) => { keyBuffer = buf; }, () => {});

  function wakeAudio() {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  }
  ["pointerdown", "pointerup", "touchend", "keydown", "click"].forEach((type) =>
    document.addEventListener(type, wakeAudio, { capture: true, passive: true }));
  function playKeySound() {
    try {
      wakeAudio();
      if (!keyBuffer) return;
      const src = audioCtx.createBufferSource();
      src.buffer = keyBuffer;
      src.playbackRate.value = 0.94 + Math.random() * 0.12;
      src.connect(audioCtx.destination);
      src.start();

      const t = Math.floor(s.elapsedMs / 100);
      return `${Math.floor(t / 10)}.${t % 10}초`;
    }
    if (s.gauge >= 1) {

    key.addEventListener("pointerup", release);
    key.addEventListener("pointercancel", release);
    key.addEventListener("pointerleave", release);
    key.addEventListener("click", (e) => {
      if (e.detail === 0) press();
    });
  });

  document.addEventListener("keydown", (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.activeElement === el.replay && (e.key === "Enter" || e.key === " ")) return;
    if (document.activeElement?.classList.contains("key") && (e.key === "Enter" || e.key === " ")) return;
    e.preventDefault();
    const key = el.keys[e.code?.endsWith("Right") || /[kl;'jJ]/.test(e.key) ? 1 : 0];
    key.classList.add("pressed");
    setTimeout(() => key.classList.remove("pressed"), 60);
    press();
  });

  el.replay.addEventListener("click", () => {
    state = initial();
    render();
  });

  document.addEventListener("visibilitychange", () => { lastFrame = null; });

  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
