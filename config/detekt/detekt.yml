build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

formatting:
  active: true
  android: true
  autoCorrect: false
  Indentation:
    active: true
    indentSize: 4
  MaximumLineLength:
    active: true
    maxLineLength: 120
  FinalNewline:
    active: true
  NoWildcardImports:
    active: true
  NoTrailingSpaces:
    active: true
  NoUnusedImports:
    active: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    active: true
    threshold: 80
  # Composable 은 슬롯과 기본값 파라미터가 많은 게 정상이라 기본 임계치를 적용하지 않는다.
  LongParameterList:
    active: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 30

style:
  MagicNumber:
    active: false
